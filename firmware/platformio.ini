[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; two app slots so the device can write a new image while running the old one.
; 1.9MB each, and the build sits around 1MB, so there is room to grow. huge_app
; would be roomier but has no second slot, which rules out OTA entirely.
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; registry copy is stuck on a 2019 alpha with no usable version tag, so pull
    ; it straight from source instead
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson@^7.0.0
    ricmoo/QRCode@^0.0.1

; TFT_eSPI is configured through build flags rather than editing User_Setup.h in
; the library folder, otherwise a `pio pkg update` silently wipes your pin map.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    ; the panel lives on HSPI (12/13/14/15) and the touch controller on VSPI
    ; (25/32/39/33). without this TFT_eSPI grabs VSPI as well and the touch bus
    ; remaps those pins out from under the display.
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

; Build for handing out. Uses config.dist.h instead of your config.h, so the
; image carries no wifi password and no device token. Never publish a binary
; built from the `cyd` env - it has your credentials compiled into it.
[env:dist]
extends = env:cyd
build_flags = ${env:cyd.build_flags} -DCONFIG_DIST=1
